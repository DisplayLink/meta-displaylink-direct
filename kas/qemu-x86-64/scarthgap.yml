      meta:
      meta-poky:

  meta-oe:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: scarthgap
    commit: bec755063a8b5da65df626f5749496aadaa4f4bb
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:

  meta-qt6:
    url: "https://code.qt.io/yocto/meta-qt6.git"
    branch: "6.8"
    commit: 2a9a0070f652134e15df332918a012862bf34047
    layers:
      .:

  meta-displaylink-direct:
    path: "."
    layers:
      .:
