    LICENSE_FLAGS_ACCEPTED:append = " commercial"

target:
  - libdlsdk
  - dlsdk-samples-basic
  - dlsdk-samples-video
  - dlsdk-qt-plugin
  - python3-dlsdk
  - python3-dlsdk-samples

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: scarthgap
    commit: b2c16f1e69130558574e1363aff944647fa9cd11
