header:
  version: 19

machine: uno-q
distro: nodistro
target: core-image-full-cmdline

repos:
  oe-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: f09a0f28aeb54ddd90415dd458338e1565bb5a49
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: '2.18'
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers: {}

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:

  meta-oe:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: af8b6d6b2f0b11595b0a0d5b82efa3129d52a628
    layers:
      meta-oe:
      meta-networking:
      meta-python:
      meta-multimedia:

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware
    commit: 6ad95d00531b32ec01792ab496718943dc95277b
    layers:
      .:

  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom.git
    branch: wrynose
